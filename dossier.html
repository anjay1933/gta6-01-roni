<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBER ISLE — dossier</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0e13; color: #eee; margin: 0; padding: 24px; }
  a { color: #ffd94a; }
  img { max-width: 100%; display: block; margin: 12px 0; border: 1px solid #333; }
  pre { background: #11141b; padding: 16px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  h1 { color: #ff6a1a; }
</style>
</head>
<body>
<h1>EMBER ISLE — dossier</h1>
<p>Entry for <a href="https://make.fun/bounty/gta6-01">Make GTA 6 (gta6-01)</a> by @roni-rockabilly.
Run <code>mkdir -p out &amp;&amp; MAKEFUN_OUTPUT_DIR=out node main.ts</code> to build
<code>out/dossier.json</code>, then open this page beside it.</p>
<div id="shots"></div>
<pre id="dossier">dossier.json not built yet.</pre>
<script>
fetch('out/dossier.json').then(r => r.json()).then(d => {
  document.getElementById('dossier').textContent = d.text || JSON.stringify(d, null, 2);
  const shots = document.getElementById('shots');
  (d.images || []).forEach((img, i) => {
    const el = document.createElement('img');
    el.src = 'data:image/jpeg;base64,' + img.data;
    el.alt = 'screenshot ' + (i + 1);
    shots.appendChild(el);
  });
}).catch(() => {});
</script>
</body>
</html>
